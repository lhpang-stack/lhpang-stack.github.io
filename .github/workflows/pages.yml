name: 发布个人主页

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 生成静态网站
        run: npm run build
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
